{{- /*
Migration jobs are named after a hash of the migration image, so every new
migration image leaves another finished Job in the namespace. Kubernetes has no
history limit for standalone Jobs (only CronJobs do), so this hook trims them
to migrationJob.historyLimit after each install/upgrade.
*/ -}}
{{- if and .Values.migrationJob.enabled (gt (int .Values.migrationJob.historyLimit) 0) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-migrations-cleanup" (include "WebApp.fullname" .) | trunc 63 | trimSuffix "-" | lower }}
  labels:
    {{- include "WebApp.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations-cleanup
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ if kindIs "invalid" .Values.migrationJob.cleanupBackoffLimit }}1{{ else }}{{ int .Values.migrationJob.cleanupBackoffLimit }}{{ end }}
  activeDeadlineSeconds: {{ if kindIs "invalid" .Values.migrationJob.cleanupActiveDeadlineSeconds }}120{{ else }}{{ int .Values.migrationJob.cleanupActiveDeadlineSeconds }}{{ end }}
  ttlSecondsAfterFinished: {{ if kindIs "invalid" .Values.migrationJob.cleanupTtlSecondsAfterFinished }}300{{ else }}{{ int .Values.migrationJob.cleanupTtlSecondsAfterFinished }}{{ end }}
  template:
    metadata:
      labels:
        {{- include "WebApp.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrations-cleanup
    spec:
      serviceAccountName: {{ include "WebApp.serviceAccountName" . | lower }}
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cleanup
          image: "{{ .Values.migrationJob.cleanupImage.repository }}:{{ .Values.migrationJob.cleanupImage.tag }}"
          imagePullPolicy: {{ .Values.migrationJob.cleanupImage.pullPolicy }}
          {{- with .Values.migrationJob.cleanupImage.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              keep={{ int .Values.migrationJob.historyLimit }}
              # Matches migration jobs from every chart version: releases before 3.2.0
              # did not label them app.kubernetes.io/component=migrations, so select on
              # the app labels they have always carried and exclude this cleanup job.
              # A "key!=value" selector also matches objects with no such label at all.
              selector='app.kubernetes.io/name={{ include "WebApp.fullname" . | lower }},app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component!=migrations-cleanup'
              # Oldest first, so the newest $keep jobs are the tail of the list.
              found=$(kubectl get jobs -n {{ .Release.Namespace }} -l "$selector" \
                --sort-by=.metadata.creationTimestamp -o name)
              count=$(printf '%s' "$found" | grep -c . || true)
              stale=$((count - keep))
              echo "found $count migration job(s), keeping newest $keep"
              if [ "$stale" -le 0 ]; then
                echo "nothing to remove"
                exit 0
              fi
              printf '%s\n' "$found" | head -n "$stale" | while read -r job; do
                echo "deleting $job"
                kubectl delete -n {{ .Release.Namespace }} "$job" --ignore-not-found --wait=false
              done
{{- end -}}
