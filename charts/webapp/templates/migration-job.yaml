{{- if .Values.migrationJob.enabled -}}
{{- if not .Values.migrationJob.image.repository }}
{{- fail "migrationJob.enabled requires migrationJob.image.repository to be set" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "WebApp.migrationJobName" . }}
  labels:
    {{- include "WebApp.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    {{- if not .Values.migrationJob.waitForItInInitContainer }}
    {{- /*
    Helm hooks drive plain `helm install`/`helm upgrade`. Argo CD ignores them
    because the Argo CD hook below takes priority: a Sync hook at wave -5 runs
    inside the sync phase, after the ServiceAccount at wave -10 and before the
    Deployment at the default wave 0. PreSync would run before the ServiceAccount
    exists, which is why the account used to be a hook itself.
    */}}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/hook": Sync
    "argocd.argoproj.io/sync-wave": "-5"
    {{- end }}
    {{- with .Values.migrationJob.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ if kindIs "invalid" .Values.migrationJob.backoffLimit }}3{{ else }}{{ int .Values.migrationJob.backoffLimit }}{{ end }}
  activeDeadlineSeconds: {{ if kindIs "invalid" .Values.migrationJob.activeDeadlineSeconds }}300{{ else }}{{ int .Values.migrationJob.activeDeadlineSeconds }}{{ end }}
  template:
    metadata:
      annotations:
      {{- with .Values.migrationJob.annotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "WebAppMigrations.labels" . | nindent 8 }}

    spec:
      serviceAccountName: {{ include "WebApp.serviceAccountName" . | lower }}
      {{- with .Values.imagePullSecrets | default }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrationJob.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "WebApp.fullname" . | lower }}-migrations
          image: "{{ .Values.migrationJob.image.repository }}:{{ .Values.migrationJob.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.migrationJob.image.pullPolicy }}
          env:
            {{- with .Values.migrationJob.environmentVariables -}}
              {{- toYaml . | nindent 10 }}
            {{- end }}
          {{- with .Values.migrationJob.containerEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.migrationJob.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.migrationJob.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.migrationJob.command }}
          command:
            {{- with .Values.migrationJob.command -}}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      restartPolicy: Never
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- end }}
