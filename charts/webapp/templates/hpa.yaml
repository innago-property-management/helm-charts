{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "WebApp.fullname" . | lower }}
  labels:
    {{- include "WebApp.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "WebApp.fullname" . | lower }}
  {{- /* No floor: minReplicas 0 requires the HPAScaleToZero feature gate on the cluster. */}}
  minReplicas: {{ int .Values.autoscaling.minReplicas }}
  {{- /* maxReplicas must be >= 1 per the HPA API, and never below minReplicas. */}}
  maxReplicas: {{ max 1 (int .Values.autoscaling.minReplicas) (int .Values.autoscaling.maxReplicas) }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- /*
    Memory is scaled on by default. Setting targetMemoryUtilizationPercentage to
    null, 0 or false in a values override drops this metric and leaves the HPA
    scaling on CPU alone.

    ContainerResource, not Resource: a Resource metric sums requests across every
    container in the pod, so one sidecar added through additionalContainers without
    a memory request makes the metric <unknown> — and an unavailable metric stops
    the HPA scaling at all, including on CPU. Scoping it to the application
    container keeps sidecars out of the calculation. ContainerResource is GA from
    Kubernetes 1.30.

    The application container still needs a memory request; the chart sets
    resources.requests.memory by default and that survives a partial resources
    override.
    */}}
    {{- with .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: ContainerResource
      containerResource:
        name: memory
        container: {{ $.Chart.Name | lower }}
        target:
          type: Utilization
          averageUtilization: {{ int . }}
    {{- end }}
  {{- if .Values.autoscaling.behavior }}
  behavior:
    {{- toYaml .Values.autoscaling.behavior | nindent 4 }}
  {{- end }}
{{- end }}
