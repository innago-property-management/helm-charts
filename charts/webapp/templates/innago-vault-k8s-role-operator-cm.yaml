{{- /*
Opt-in: the ConfigMap is only created when innagoVaultK8sRoleOperator.use is explicitly
true. The block is defaulted to an empty dict so that removing or nulling
innagoVaultK8sRoleOperator leaves the integration disabled instead of failing rendering.
*/ -}}
{{- $vaultOperator := default dict .Values.innagoVaultK8sRoleOperator -}}
{{- if $vaultOperator.use -}}
{{- $name := include "WebApp.fullname" . | lower | trunc 52 | trimSuffix "-" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-vault-role" $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "WebApp.labels" . | nindent 4 }}
  annotations:
    innago.com/vault-k8s-role: ""
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  serviceAccountName: "{{ include "WebApp.serviceAccountName" . }}"
  additionalPolicies: "{{ $vaultOperator.additionalPolicies | default (list) | join "," }}"
{{- end -}}
