{{- if .Values.serviceAccount.create -}}
{{- $migrationJob := default dict .Values.migrationJob -}}
{{- /*
The ServiceAccount, Role and RoleBinding are ordinary tracked resources, never hooks.

They used to carry helm.sh/hook: pre-install,pre-upgrade so the migration job could
mount the account. That made Argo CD delete and recreate all three on every sync:
BeforeHookCreation is Argo CD's DEFAULT hook-delete-policy, so dropping the Helm
annotation in 3.2.2 changed nothing. Recreating a ServiceAccount rotates its UID and
invalidates projected tokens held by running pods, and any sync interrupted between
the delete and the create leaves the Deployment unable to schedule pods at all
("error looking up service account").

Ordering is preserved with sync waves instead: these land at wave -10 and the
migration job runs as an Argo CD Sync hook at wave -5, so the account exists before
the job needs it. Argo CD hooks take priority over Helm hooks, so the job's
helm.sh/hook annotations only apply to plain `helm install`/`helm upgrade`.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "WebApp.serviceAccountName" . | lower }}
  labels:
    {{- include "WebApp.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "WebApp.serviceAccountName" . | lower }}
  labels:
    {{- include "WebApp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: Prune=false
rules:
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - get
      - list
      - watch
{{- if and $migrationJob.enabled (gt (int $migrationJob.historyLimit) 0) }}
      # Required by the migration history cleanup hook
      - delete
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "WebApp.serviceAccountName" . | lower }}
  labels:
    {{- include "WebApp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: Prune=false
subjects:
  - kind: ServiceAccount
    name: {{ include "WebApp.serviceAccountName" . | lower }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "WebApp.serviceAccountName" . | lower }}
{{- end }}
