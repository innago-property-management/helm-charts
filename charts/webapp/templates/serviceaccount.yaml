{{- if .Values.serviceAccount.create -}}
{{- $migrationJob := default dict .Values.migrationJob -}}
{{- /*
The migration job runs as a pre-install/pre-upgrade hook and mounts this
ServiceAccount, so the account, Role and RoleBinding must be created in the same
phase at a lower weight; normal resources are applied only afterwards.

They deliberately carry NO helm.sh/hook-delete-policy. This ServiceAccount is a
long-lived dependency of the Deployment, and before-hook-creation made Argo CD
delete it at the start of every sync: any sync that did not finish the recreation
left the workload permanently unable to start pods, with
"error looking up service account <ns>/<name>: serviceaccount not found".
*/ -}}
{{- $preSyncHook := not $migrationJob.waitForItInInitContainer -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "WebApp.serviceAccountName" . | lower }}
  labels:
    {{- include "WebApp.labels" . | nindent 4 }}
  annotations:
    {{- if $preSyncHook }}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "WebApp.serviceAccountName" . | lower }}
  labels:
    {{- include "WebApp.labels" . | nindent 4 }}
  annotations:
    {{- if $preSyncHook }}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    {{- end }}
    argocd.argoproj.io/sync-options: Prune=false
rules:
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - get
      - list
      - watch
{{- if and $migrationJob.enabled (gt (int $migrationJob.historyLimit) 0) }}
      # Required by the migration history cleanup hook
      - delete
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "WebApp.serviceAccountName" . | lower }}
  labels:
    {{- include "WebApp.labels" . | nindent 4 }}
  annotations:
    {{- if $preSyncHook }}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    {{- end }}
    argocd.argoproj.io/sync-options: Prune=false
subjects:
  - kind: ServiceAccount
    name: {{ include "WebApp.serviceAccountName" . | lower }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "WebApp.serviceAccountName" . | lower }}
{{- end }}
