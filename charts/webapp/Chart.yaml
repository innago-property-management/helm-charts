apiVersion: v2
name: webapp
description: Innago Helm chart for deploying web applications to Kubernetes with production-ready patterns
type: application
version: 3.5.0
appVersion: "2.6.3"
icon: https://innago-property-management.github.io/helm-charts/assets/icons/helm.svg
home: https://innago-property-management.github.io/helm-charts/webapp
sources:
  - https://github.com/innago-property-management/helm-charts/tree/main/charts/webapp
maintainers:
  - name: "Innago"
    email: "support@innago.com"
keywords:
  - webapp
  - kubernetes
  - deployment
  - application
  - container
annotations:
  artifacthub.io/category: "integration-delivery"
  artifacthub.io/license: "Apache-2.0"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/innago-property-management/helm-charts/tree/main/charts/webapp
    - name: Support
      url: https://github.com/innago-property-management/helm-charts/issues
    - name: Production Guide
      url: https://github.com/innago-property-management/helm-charts/blob/main/charts/webapp/PRODUCTION.md
  artifacthub.io/changes: |
    - kind: fixed
      description: "ServiceAccount/Role/RoleBinding are no longer Helm hooks, so Argo CD stops deleting and recreating them on every sync (BeforeHookCreation is Argo CD's default hook-delete-policy, so removing only the Helm delete-policy in 3.2.2 was not enough)"
    - kind: changed
      description: "Ordering now uses sync waves: ServiceAccount/Role/RoleBinding at wave -10, the migration job as an Argo CD Sync hook at wave -5, the Deployment at wave 0"
    - kind: added
      description: "autoscaling.targetCPUUtilizationPercentage can now be set to null, 0 or false for memory-only scaling; disabling both CPU and memory fails rendering instead of silently defaulting to 80% CPU"
    - kind: changed
      description: "HPA now scales on memory as well as CPU by default (autoscaling.targetMemoryUtilizationPercentage: 80), as a ContainerResource metric scoped to the application container so sidecars cannot invalidate it; set it to null, 0 or false for CPU-only scaling"
    - kind: fixed
      description: "ServiceAccount/Role/RoleBinding no longer carry helm.sh/hook-delete-policy: before-hook-creation, which made Argo CD delete the ServiceAccount on every sync and left pods unschedulable when a sync did not finish"
    - kind: fixed
      description: "Replace the invalid sync option PreserveResources=true with Prune=false on the ServiceAccount, Role and RoleBinding"
    - kind: fixed
      description: "Migration history cleanup now also prunes migration jobs created before 3.1.0, which predate the app.kubernetes.io/component label it selected on"
    - kind: added
      description: "Expose migration job backoffLimit/activeDeadlineSeconds and the cleanup hook timings as values instead of hardcoding them"
    - kind: added
      description: "Retain only 3 old ReplicaSets via revisionHistoryLimit (configurable; Kubernetes default was 10)"
    - kind: changed
      description: "BREAKING: replicaCount and autoscaling.minReplicas are now honoured as written, including 0; the previous silent floor of 2 is gone"
    - kind: added
      description: "Keep only the newest migrationJob.historyLimit (default 3) migration jobs via a post-install/post-upgrade cleanup hook"
    - kind: changed
      description: "BREAKING: innagoVaultK8sRoleOperator.use now defaults to false; the vault-role ConfigMap is opt-in"
    - kind: changed
      description: "BREAKING: the vault-role ConfigMap is a normal release resource instead of a pre-install/pre-upgrade hook, so it is removed on uninstall"
    - kind: added
      description: "Add standard chart labels to the vault-role ConfigMap"
    - kind: fixed
      description: "Make the networkPolicy, metrics/serviceMonitor, vpa and innagoVaultK8sRoleOperator gates nil-safe and default to disabled"
    - kind: fixed
      description: "Avoid a double hyphen in the vault-role ConfigMap name when the release fullname is truncated"
