apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fake-job.fullname" . }}
  labels:
    {{- include "fake-job.labels" . | nindent 4 }}
spec:
  {{- /*
  This chart runs at most a single instance, and it follows the webapp it belongs to:
  the *-job Argo CD applications read the same value-overrides file as their webapp
  counterpart, so whichever knob governs the webapp decides whether this runs or not.
    webapp >= 1 replica  -> 1
    webapp == 0 replicas -> 0
  autoscaling.minReplicas is the governing knob when autoscaling is enabled, otherwise
  replicaCount is. Values above 1 are clamped rather than rejected, because the shared
  value file legitimately gives the webapp more than one replica.
  */}}
  {{- $desired := .Values.replicaCount -}}
  {{- $autoscaling := default dict .Values.autoscaling -}}
  {{- if $autoscaling.enabled -}}
  {{- $desired = $autoscaling.minReplicas -}}
  {{- end }}
  replicas: {{ if kindIs "invalid" $desired }}1{{ else }}{{ max 0 (min 1 (int $desired)) }}{{ end }}
  {{- /* Number of old ReplicaSets kept for rollback (Kubernetes keeps 10 by default). */}}
  revisionHistoryLimit: {{ if kindIs "invalid" .Values.revisionHistoryLimit }}3{{ else }}{{ int .Values.revisionHistoryLimit }}{{ end }}
  selector:
    matchLabels:
      {{- include "fake-job.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "fake-job.labels" . | nindent 8 }}
        {{- with .Values.jobPodLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "fake-job.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.httpContainerPort | default 80 }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraEnv }}
          env:
           {{- toYaml . | nindent 12 }} 
          {{- end }}
          {{- with .Values.containerEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
