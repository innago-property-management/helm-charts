name: build-publish

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: 
  contents: read
  packages: write
  
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions: 
      contents: write
      packages: write
      pages: write
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      with: 
        fetch-depth: '0'
        submodules: 'true'
        token: '${{ secrets.SEMVER_TOKEN_NO_EXPIRATION }}'
    - name: Configure Git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
        git submodule update --init --recursive
    - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 #v4.3.0
    - name: Prepare GPG key 
      run: |
        gpg_dir=.cr-gpg
        mkdir "$gpg_dir"
        keyring="$gpg_dir/secring.gpg"
        base64 -d <<< "$GPG_KEYRING_BASE64" > "$keyring" 
        passphrase_file="$gpg_dir/passphrase"
        echo "$GPG_PASSPHRASE" > "$passphrase_file" 
        echo "CR_PASSPHRASE_FILE=$passphrase_file" >> "$GITHUB_ENV" 
        echo "CR_KEYRING=$keyring" >> "$GITHUB_ENV" 
      env:
        GPG_KEYRING_BASE64: "${{ secrets.GPG_KEYRING_BASE64 }}"
        GPG_PASSPHRASE: "${{ secrets.GPG_PASSPHRASE }}"
    - name: Login to GHCR
      uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Update Dependencies
      id: deps
      run: |
        for dir in $(ls -d charts/*/); do
          if [ -f "$dir/Chart.yaml" ] && grep -q '^dependencies:' "$dir/Chart.yaml"; then
            helm dependency list "$dir" | tail -n +2 | awk '$3 !~ /^oci:\/\// { print "helm repo add " $1 " " $3 }' | sort -u | while read -r cmd; do
                $cmd || echo "Repo add failed. Assuming it already exists."
            done
            helm dependency update "$dir"
          fi
        done
    - name: Lint charts
      run: helm lint charts/*/
    - name: Run chart-releaser
      # Publishing must only happen from main. Running this on pull_request
      # created GitHub releases from PR branches and raced the main-branch run
      # for the gh-pages index.yaml push.
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f #1.7.0
      env:
        CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        CR_KEY: "${{ secrets.CR_KEY }}"
        CR_SIGN: true
      with:
        charts_dir: 'charts'
        skip_existing: 'true'
    - name: Deploy artifacthub-repo.yml and assets to gh-pages
      if: github.ref == 'refs/heads/main'
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
        git fetch origin gh-pages
        git checkout gh-pages -f
        git checkout main -- artifacthub-repo.yml
        git checkout main -- assets/ || true
        git add artifacthub-repo.yml assets/
        if git diff --staged --quiet; then
          echo "No changes to deploy"
        else
          git commit -m "Update artifacthub-repo.yml and assets from main [skip ci]"
          git push origin gh-pages
        fi
        git checkout main
    - name: Push chart to GHCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        shopt -s nullglob
        failed=()
        for pkg in .cr-release-packages/*.tgz; do
          if [ -z "${pkg:-}" ]; then
            break
          fi
          # Do not abort the loop: a chart whose GHCR package does not exist yet
          # is rejected with "403 denied: permission_denied: write_package",
          # which previously stopped every remaining chart from being pushed.
          helm push "${pkg}" oci://ghcr.io/${{ github.repository }} || failed+=("${pkg}")
        done
        if [ ${#failed[@]} -gt 0 ]; then
          for pkg in "${failed[@]}"; do
            echo "::error::failed to push ${pkg} to ghcr.io/${{ github.repository }}"
          done
          echo "A new chart needs its GHCR package created once by a user with" \
               "write:packages, then the repository granted Write under the" \
               "package's 'Manage Actions access' settings."
          exit 1
        fi
      env:
          HELM_EXPERIMENTAL_OCI: 1
